<figure class="figura">
<svg viewBox="0 0 600 420" role="img" aria-label="Esquema de un descalcificador: la resina atrapa el calcio y el magnesio y suelta sodio">
<defs><pattern id="bolas" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="6.5" fill="#cfe3f0" stroke="#a9c9de"/></pattern></defs>
<rect x="0" y="80" width="230" height="22" rx="4" fill="#cfdbe3"/>
<g><circle cx="40" cy="91" r="10" fill="#c2852b"/><circle cx="85" cy="91" r="10" fill="#b84c3c"/><circle cx="130" cy="91" r="10" fill="#c2852b"/><circle cx="175" cy="91" r="10" fill="#c2852b"/></g>
<text x="10" y="62" font-size="19" font-weight="700" fill="#073b5a">Entra agua dura</text>
<rect x="225" y="60" width="130" height="290" rx="30" fill="url(#bolas)" stroke="#0b5d8c" stroke-width="4"/>
<g fill="#c2852b"><circle cx="252" cy="95" r="6"/><circle cx="288" cy="88" r="6"/><circle cx="322" cy="100" r="6"/><circle cx="270" cy="122" r="6"/><circle cx="306" cy="128" r="6"/></g><g fill="#b84c3c"><circle cx="336" cy="120" r="5.5"/><circle cx="246" cy="140" r="5.5"/></g>
<rect x="244" y="200" width="92" height="34" rx="17" fill="#0b5d8c"/><text x="290" y="223" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Resina</text>
<rect x="350" y="318" width="250" height="22" rx="4" fill="#cfdbe3"/>
<g fill="#2aa5c9"><circle cx="400" cy="329" r="9"/><circle cx="440" cy="329" r="9"/><circle cx="480" cy="329" r="9"/><circle cx="520" cy="329" r="9"/><circle cx="560" cy="329" r="9"/></g>
<text x="395" y="372" font-size="19" font-weight="700" fill="#073b5a">Sale agua blanda</text>
<rect x="430" y="60" width="130" height="130" rx="14" fill="#fff" stroke="#9fb3c1" stroke-width="3"/>
<path d="M440 178 L470 140 L490 160 L510 128 L550 178 Z" fill="#eef2f5" stroke="#cfd8df"/>
<text x="495" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#073b5a">Depósito</text><text x="495" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#073b5a">de sal</text>
<path d="M430 160 C400 170 380 190 362 210" fill="none" stroke="#0b5d8c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#fl)"/>
<defs><marker id="fl" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5d8c"/></marker></defs>
<text x="366" y="268" font-size="17" fill="#0b5d8c">regeneración</text>
<path d="M290 350 V400" stroke="#5b6b78" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#fl2)"/>
<defs><marker id="fl2" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5b6b78"/></marker></defs>
<text x="306" y="398" font-size="17" fill="#5b6b78">desagüe: se lleva la cal</text>
<g font-size="17" fill="#33424e"><circle cx="20" cy="165" r="8" fill="#c2852b"/><text x="34" y="170">Calcio (Ca²⁺)</text><circle cx="20" cy="195" r="8" fill="#b84c3c"/><text x="34" y="200">Magnesio (Mg²⁺)</text><circle cx="20" cy="225" r="8" fill="#2aa5c9"/><text x="34" y="230">Sodio (Na⁺)</text></g>
</svg>
<figcaption>La resina atrapa el calcio y el magnesio y suelta sodio a cambio. Cuando se satura, el agua salada del depósito la "regenera" y arrastra la cal al desagüe.</figcaption>
</figure>
